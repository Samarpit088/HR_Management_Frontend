version: '3.8'

services:
  # Frontend Service (Thymeleaf Spring Boot Application)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
    environment:
      # Backend API URL
      BACKEND_API_URL: ${BACKEND_API_URL:-http://localhost:8080}
      
      # Server Configuration
      SERVER_PORT: 8081
      
      # Thymeleaf Configuration
      SPRING_THEMELEAF_CACHE: ${SPRING_THEMELEAF_CACHE:-false}
      
      # Java Options
      JAVA_OPTS: "-Xmx512m -Xms256m"
    networks:
      - hr_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  hr_network:
    driver: bridge
