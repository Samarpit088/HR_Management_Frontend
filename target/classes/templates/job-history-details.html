<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Job History Details</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-3">
        <div class="col">
            <a href="/job-history" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left me-2"></i>Back to Job History
            </a>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
            <h5 class="mb-0">
                <i class="bi bi-clock-history me-2"></i>
                Job History Details - Employee #<span id="employeeIdDisplay">...</span>
            </h5>
        </div>
        <div class="card-body">
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted fw-bold">Loading job history details...</p>
            </div>
            
            <div id="detailsContent" style="display: none;">
                <!-- Employee Info Card -->
                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="card" style="border-left: 5px solid #667eea;">
                            <div class="card-body">
                                <h5 class="card-title mb-3">
                                    <i class="bi bi-person-badge-fill me-2" style="color: #667eea;"></i>
                                    Employee Information
                                </h5>
                                <div class="row">
                                    <div class="col-md-4">
                                        <p><strong>Employee ID:</strong> <span id="empId" class="text-primary">-</span></p>
                                    </div>
                                    <div class="col-md-4">
                                        <p><strong>Full Name:</strong> <span id="empName">-</span></p>
                                    </div>
                                    <div class="col-md-4">
                                        <p><strong>Email:</strong> <span id="empEmail">-</span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Job History Timeline -->
                <h5 class="mb-3">
                    <i class="bi bi-calendar-event me-2" style="color: #667eea;"></i>
                    Career Timeline
                </h5>
                <div id="historyTimeline">
                    <!-- Timeline will be loaded here -->
                </div>
            </div>
            
            <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>
</div>

<!-- Page-specific scripts -->
<th:block layout:fragment="scripts">
<script>
    console.log('Job History Details script loaded');
    
    const urlParams = new URLSearchParams(window.location.search);
    const employeeId = urlParams.get('employeeId');
    
    async function loadJobHistoryDetails() {
        if (!employeeId) {
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'No employee ID provided';
            return;
        }
        
        document.getElementById('employeeIdDisplay').textContent = employeeId;
        
        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('detailsContent').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            // Fetch employee details
            const employeeData = await API.get(`/employees/${employeeId}`);
            document.getElementById('empId').textContent = employeeData.employeeId || '-';
            document.getElementById('empName').textContent = `${employeeData.firstName || ''} ${employeeData.lastName || ''}`.trim() || '-';
            document.getElementById('empEmail').textContent = employeeData.email || '-';
            
            // Fetch job history
            const historyData = await API.get(`/jobHistory/search/findByEmployee_EmployeeId?employeeId=${employeeId}&size=100`);
            const history = historyData._embedded?.jobHistories || historyData._embedded?.jobHistorys || historyData._embedded?.jobHistoryses || [];
            
            displayTimeline(history);
            
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('detailsContent').style.display = 'block';
            document.getElementById('detailsContent').classList.add('animate__animated', 'animate__fadeIn');
        } catch (error) {
            console.error('Error loading details:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load job history details: ' + error.message;
        }
    }
    
    function displayTimeline(history) {
        const timeline = document.getElementById('historyTimeline');
        timeline.innerHTML = '';
        
        if (history.length === 0) {
            timeline.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-inbox" style="font-size: 3em; color: #ccc;"></i>
                    <p class="text-muted mt-3">No job history found</p>
                </div>
            `;
            return;
        }
        
        // Sort by start date descending
        history.sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
        
        history.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card mb-3 animate__animated animate__fadeInUp';
            card.style.animationDelay = `${index * 0.1}s`;
            card.style.borderLeft = '5px solid #764ba2';
            
            const startDate = new Date(item.startDate).toLocaleDateString();
            const endDate = item.endDate ? new Date(item.endDate).toLocaleDateString() : 'Present';
            
            card.innerHTML = `
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <h6 class="mb-2">
                                <i class="bi bi-briefcase-fill me-2" style="color: #764ba2;"></i>
                                Job ID: <span class="badge bg-primary">${item.jobId || '-'}</span>
                            </h6>
                            <p class="mb-2">
                                <i class="bi bi-building me-2"></i>
                                <strong>Department:</strong> ${item.departmentId || '-'}
                            </p>
                        </div>
                        <div class="col-md-4 text-md-end">
                            <span class="badge ${item.endDate ? 'bg-secondary' : 'bg-success'}" style="font-size: 0.9em; padding: 8px 16px;">
                                ${item.endDate ? 'Past Position' : 'Current Position'}
                            </span>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-6">
                            <p class="mb-1">
                                <i class="bi bi-calendar-check text-success me-2"></i>
                                <strong>Start Date:</strong> ${startDate}
                            </p>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-1">
                                <i class="bi bi-calendar-x ${item.endDate ? 'text-danger' : 'text-muted'} me-2"></i>
                                <strong>End Date:</strong> ${endDate}
                            </p>
                        </div>
                    </div>
                </div>
            `;
            timeline.appendChild(card);
        });
    }
    
    // Load details on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadJobHistoryDetails, 100);
        });
    } else {
        setTimeout(loadJobHistoryDetails, 100);
    }
</script>
</th:block>

</body>
</html>
