<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Edit Department</title>
    <script>
        // Set page title immediately
        document.title = 'Edit Department - HR Management';
    </script>
</head>
<body>
<div layout:fragment="content">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col">
            <button id="backButton" class="btn btn-outline-primary" onclick="goBack()">
                <i class="bi bi-arrow-left me-2"></i>Back to Department Details
            </button>
        </div>
    </div>
    
    <!-- Main Card -->
    <div class="card shadow-sm">
        <div class="card-header" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white;">
            <h5 class="mb-0">
                <i class="bi bi-pencil-square me-2"></i>
                Edit Department - ID #<span id="deptIdDisplay">...</span>
            </h5>
        </div>
        <div class="card-body">
            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted fw-bold">Loading department details...</p>
            </div>
            
            <!-- Success Message -->
            <div id="successMessage" class="alert alert-success animate__animated animate__fadeIn" style="display: none;">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span id="successText"></span>
            </div>
            
            <!-- Error Message -->
            <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText"></span>
            </div>
            
            <!-- Edit Department Form -->
            <form id="editDepartmentForm" style="display: none;">
                <!-- Department Information Section -->
                <div class="card mb-4" style="border-left: 5px solid #4facfe;">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="bi bi-diagram-3-fill me-2" style="color: #4facfe;"></i>
                            Department Information
                        </h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="departmentId" class="form-label">Department ID</label>
                                <input type="number" class="form-control" id="departmentId" disabled>
                                <small class="text-muted">Cannot be changed</small>
                            </div>
                            <div class="col-md-8">
                                <label for="departmentName" class="form-label">Department Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="departmentName" required maxlength="30">
                                <small class="text-muted">Maximum 30 characters</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Location Section -->
                <div class="card mb-4" style="border-left: 5px solid #00f2fe;">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="bi bi-geo-alt-fill me-2" style="color: #00f2fe;"></i>
                            Location
                        </h5>
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label for="locationId" class="form-label">Location</label>
                                <select class="form-select" id="locationId">
                                    <option value="">No location assigned</option>
                                </select>
                                <small class="text-muted">Department's location</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="d-flex gap-2 justify-content-end">
                    <button type="button" class="btn btn-secondary" onclick="goBack()">
                        <i class="bi bi-x-circle me-1"></i> Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="bi bi-check-circle me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Page-specific scripts -->
<th:block layout:fragment="scripts">
<script>
    console.log('Edit Department script loaded');
    
    const urlParams = new URLSearchParams(window.location.search);
    const departmentId = urlParams.get('departmentId');
    
    let locations = [];
    let originalData = {};
    
    function goBack() {
        window.location.href = `/department-details?departmentId=${departmentId}`;
    }
    
    // Load locations for dropdown
    async function loadLocations() {
        try {
            const data = await API.get('/locations?size=100');
            locations = data._embedded?.locationses || data._embedded?.locations || [];
            
            const select = document.getElementById('locationId');
            locations.forEach(loc => {
                const option = document.createElement('option');
                option.value = loc.locationId;
                option.textContent = `${loc.city} (${loc.countryId || 'N/A'})`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading locations:', error);
        }
    }
    
    // Load department details
    async function loadDepartmentDetails() {
        if (!departmentId) {
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'No department ID provided';
            return;
        }
        
        document.getElementById('deptIdDisplay').textContent = departmentId;
        
        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('editDepartmentForm').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            // Load locations first
            await loadLocations();
            
            // Fetch department details
            const deptData = await API.get(`/departments/${departmentId}`);
            
            console.log('Department data:', deptData);
            originalData = deptData;
            
            // Populate form
            document.getElementById('departmentId').value = deptData.departmentId || '';
            document.getElementById('departmentName').value = deptData.departmentName || '';
            
            // Set location dropdown
            if (deptData.locationId) {
                document.getElementById('locationId').value = deptData.locationId;
            }
            
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('editDepartmentForm').style.display = 'block';
        } catch (error) {
            console.error('Error loading details:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load department details: ' + error.message;
        }
    }
    
    // Handle form submission
    document.getElementById('editDepartmentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Hide messages
        document.getElementById('successMessage').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';
        
        // Disable submit button
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
        
        try {
            // Collect only changed fields
            const updates = {};
            
            const newName = document.getElementById('departmentName').value;
            if (newName !== originalData.departmentName) {
                updates.departmentName = newName;
            }
            
            const newLocationId = document.getElementById('locationId').value;
            const oldLocationId = originalData.locationId ? originalData.locationId.toString() : '';
            if (newLocationId !== oldLocationId) {
                updates.locationId = newLocationId ? parseInt(newLocationId) : null;
            }
            
            // Check if anything changed
            if (Object.keys(updates).length === 0) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorText').textContent = 'No changes detected';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Save Changes';
                return;
            }
            
            console.log('Submitting updates:', updates);
            
            // Submit to backend
            const response = await fetch(`/api/proxy?endpoint=/api/v1/departments/${departmentId}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updates)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || errorData.error || 'Failed to update department');
            }
            
            const result = await response.json();
            console.log('Department updated successfully:', result);
            
            // Show success message
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('successText').textContent = 'Department updated successfully!';
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Redirect after 1.5 seconds
            setTimeout(() => {
                goBack();
            }, 1500);
            
        } catch (error) {
            console.error('Error updating department:', error);
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = error.message || 'Failed to update department. Please try again.';
            
            // Scroll to top to show error
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Re-enable submit button
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Save Changes';
        }
    });
    
    // Load data on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadDepartmentDetails);
    } else {
        loadDepartmentDetails();
    }
</script>
</th:block>

</body>
</html>
