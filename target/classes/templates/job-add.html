<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Add Job</title>
    <script>
        document.title = 'Add Job - HR Management';
    </script>
</head>
<body>
<div layout:fragment="content">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col">
            <button class="btn btn-outline-primary" onclick="window.location.href='/jobs'">
                <i class="bi bi-arrow-left me-2"></i>Back to Jobs
            </button>
        </div>
    </div>
    
    <!-- Main Card -->
    <div class="card shadow-sm">
        <div class="card-header" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white;">
            <h5 class="mb-0">
                <i class="bi bi-plus-circle-fill me-2"></i>
                Add New Job Position
            </h5>
        </div>
        <div class="card-body">
            <!-- Success Message -->
            <div id="successMessage" class="alert alert-success animate__animated animate__fadeIn" style="display: none;">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span id="successText"></span>
            </div>
            
            <!-- Error Message -->
            <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText"></span>
            </div>
            
            <!-- Add Job Form -->
            <form id="addJobForm">
                <!-- Job Information Section -->
                <div class="card mb-4" style="border-left: 5px solid #fa709a;">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="bi bi-briefcase-fill me-2" style="color: #fa709a;"></i>
                            Job Information
                        </h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="jobId" class="form-label">Job ID <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="jobId" required maxlength="10">
                                <small class="text-muted">Maximum 10 characters (e.g., IT_PROG)</small>
                            </div>
                            <div class="col-md-8">
                                <label for="jobTitle" class="form-label">Job Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="jobTitle" required maxlength="35">
                                <small class="text-muted">Maximum 35 characters</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Salary Range Section -->
                <div class="card mb-4" style="border-left: 5px solid #fee140;">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="bi bi-currency-dollar me-2" style="color: #fee140;"></i>
                            Salary Range
                        </h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="minSalary" class="form-label">Minimum Salary</label>
                                <input type="number" class="form-control" id="minSalary" min="1" max="999999" step="1">
                                <small class="text-muted">Optional - Must be greater than 0 (max 6 digits)</small>
                            </div>
                            <div class="col-md-6">
                                <label for="maxSalary" class="form-label">Maximum Salary</label>
                                <input type="number" class="form-control" id="maxSalary" min="1" max="999999" step="1">
                                <small class="text-muted">Optional - Must be greater than 0 (max 6 digits)</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="d-flex gap-2 justify-content-end">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='/jobs'">
                        <i class="bi bi-x-circle me-1"></i> Cancel
                    </button>
                    <button type="submit" class="btn btn-success" id="submitBtn">
                        <i class="bi bi-check-circle me-1"></i> Add Job
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Page-specific scripts -->
<th:block layout:fragment="scripts">
<script>
    console.log('Add Job script loaded');
    
    // Handle form submission
    document.getElementById('addJobForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Hide messages
        document.getElementById('successMessage').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';
        
        // Disable submit button
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Adding...';
        
        try {
            // Collect form data
            const jobData = {
                jobId: document.getElementById('jobId').value.trim(),
                jobTitle: document.getElementById('jobTitle').value.trim()
            };
            
            // Add salary fields if provided and validate
            const minSalaryInput = document.getElementById('minSalary').value;
            const maxSalaryInput = document.getElementById('maxSalary').value;
            
            if (minSalaryInput !== '' && minSalaryInput !== null) {
                const minSalaryValue = parseInt(minSalaryInput);
                if (isNaN(minSalaryValue) || minSalaryValue <= 0) {
                    throw new Error('Minimum salary must be greater than zero');
                }
                if (minSalaryValue > 999999) {
                    throw new Error('Minimum salary can have maximum 6 digits (999999)');
                }
                jobData.minSalary = minSalaryValue;
            }
            
            if (maxSalaryInput !== '' && maxSalaryInput !== null) {
                const maxSalaryValue = parseInt(maxSalaryInput);
                if (isNaN(maxSalaryValue) || maxSalaryValue <= 0) {
                    throw new Error('Maximum salary must be greater than zero');
                }
                if (maxSalaryValue > 999999) {
                    throw new Error('Maximum salary can have maximum 6 digits (999999)');
                }
                jobData.maxSalary = maxSalaryValue;
            }
            
            // Validate salary range
            if (jobData.minSalary && jobData.maxSalary && jobData.minSalary > jobData.maxSalary) {
                throw new Error('Minimum salary cannot be greater than maximum salary');
            }
            
            console.log('Submitting job data:', jobData);
            
            // Submit to backend
            const response = await fetch('/api/proxy?endpoint=/api/v1/jobs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jobData)
            });
            
            console.log('Response status:', response.status);
            console.log('Response ok:', response.ok);
            
            // Parse response
            let result;
            try {
                result = await response.json();
                console.log('Response body:', result);
            } catch (e) {
                console.error('Failed to parse response:', e);
                throw new Error('Invalid response from server');
            }
            
            // Check if response indicates an error (even if status is 200)
            if (!response.ok || result.success === false || result.error) {
                let errorMessage = 'Failed to add job';
                if (result.message) {
                    errorMessage = result.message;
                } else if (result.error) {
                    errorMessage = typeof result.error === 'string' ? result.error : result.error.message || errorMessage;
                }
                console.error('Server returned error:', errorMessage);
                throw new Error(errorMessage);
            }
            
            console.log('Job added successfully:', result);
            
            // Show success message
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('successText').textContent = `Job "${jobData.jobTitle}" (ID: ${jobData.jobId}) added successfully!`;
            
            // Reset form
            document.getElementById('addJobForm').reset();
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = `/job-details?jobId=${encodeURIComponent(jobData.jobId)}`;
            }, 2000);
            
        } catch (error) {
            console.error('Error adding job:', error);
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = error.message || 'Failed to add job. Please try again.';
            
            // Scroll to top to show error
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } finally {
            // Re-enable submit button
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Add Job';
        }
    });
</script>
</th:block>

</body>
</html>
