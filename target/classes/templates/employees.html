<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Employees</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h5 class="mb-0">
                <i class="bi bi-people-fill me-2" style="color: #667eea;"></i>
                All Employees - Managed by Navya
            </h5>
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <a href="/employee-add" class="btn btn-success btn-sm">
                    <i class="bi bi-person-plus-fill me-1"></i> Add Employee
                </a>
                <select id="departmentFilter" class="form-select form-select-sm" style="width: 180px;">
                    <option value="">All Departments</option>
                </select>
                <select id="jobFilter" class="form-select form-select-sm" style="width: 150px;">
                    <option value="">All Jobs</option>
                </select>
                <div class="input-group" style="max-width: 250px;">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search by name...">
                </div>
                <div class="input-group" style="max-width: 250px;">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="text" id="emailSearchInput" class="form-control border-start-0" placeholder="Search by email...">
                </div>
            </div>
        </div>
        <div class="card-body">
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted fw-bold">Loading employees...</p>
            </div>
            
            <div id="employeesTable" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th><i class="bi bi-hash me-1"></i>ID</th>
                                <th><i class="bi bi-person me-1"></i>Name</th>
                                <th><i class="bi bi-envelope me-1"></i>Email</th>
                                <th><i class="bi bi-telephone me-1"></i>Phone</th>
                                <th><i class="bi bi-briefcase me-1"></i>Job</th>
                                <th><i class="bi bi-diagram-3 me-1"></i>Department</th>
                                <th><i class="bi bi-currency-dollar me-1"></i>Salary</th>
                                <th><i class="bi bi-calendar me-1"></i>Hire Date</th>
                                <th class="text-center"><i class="bi bi-gear-fill me-1"></i>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employeesBody"></tbody>
                    </table>
                </div>
                
                <nav aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>
            
            <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
    let currentPage = 0, pageSize = 10, totalPages = 0, departments = [], jobs = [];
    let currentSearch = '', currentEmailSearch = '', currentDept = '', currentJob = '';
    
    async function loadDepartments() {
        try {
            const data = await API.get('/departments?size=100');
            departments = data._embedded?.departmentses || data._embedded?.departments || [];
            const select = document.getElementById('departmentFilter');
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.departmentId;
                option.textContent = dept.departmentName;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading departments:', error);
        }
    }
    
    async function loadJobs() {
        try {
            const data = await API.get('/jobs?size=100');
            jobs = data._embedded?.jobses || data._embedded?.jobs || [];
            const select = document.getElementById('jobFilter');
            jobs.forEach(job => {
                const option = document.createElement('option');
                option.value = job.jobId;
                option.textContent = job.jobTitle;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading jobs:', error);
        }
    }
    
    async function loadEmployees(page = 0) {
        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('employeesTable').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            // Build query parameters
            let url = `/employees/search?page=${page}&size=${pageSize}`;
            if (currentSearch) url += `&query=${encodeURIComponent(currentSearch)}`;
            if (currentEmailSearch) url += `&email=${encodeURIComponent(currentEmailSearch)}`;
            if (currentDept) url += `&departmentId=${currentDept}`;
            if (currentJob) url += `&jobId=${encodeURIComponent(currentJob)}`;
            
            const data = await API.get(url);
            const employees = data._embedded?.employeeses || data._embedded?.employees || [];
            totalPages = data.page?.totalPages || 1;
            currentPage = page;
            
            displayEmployees(employees);
            updatePagination();
            
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('employeesTable').style.display = 'block';
        } catch (error) {
            console.error('Error loading employees:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load employees: ' + error.message;
        }
    }
    
    function formatCurrency(amount) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(amount);
    }
    
    function formatDate(dateString) {
        if (!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    
    function displayEmployees(employees) {
        const tbody = document.getElementById('employeesBody');
        tbody.innerHTML = '';
        
        if (employees.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-5"><i class="bi bi-inbox" style="font-size: 3em; color: #ccc;"></i><p class="text-muted mt-3">No employees found</p></td></tr>';
            return;
        }
        
        employees.forEach((emp, index) => {
            const fullName = `${emp.firstName || ''} ${emp.lastName || ''}`.trim();
            const jobTitle = emp.job?.jobTitle || emp.jobId || 'N/A';
            const deptName = emp.department?.departmentName || emp.departmentId || 'N/A';
            
            const salaryValue = emp.salary || emp.Salary || null;
            const salary = salaryValue ? formatCurrency(salaryValue) : 'N/A';
            
            const hireDateValue = emp.hireDate || emp.HireDate || emp.hire_date || null;
            const hireDate = formatDate(hireDateValue);
            
            const row = document.createElement('tr');
            row.style.animationDelay = `${index * 0.05}s`;
            row.classList.add('animate__animated', 'animate__fadeInUp');
            row.innerHTML = `
                <td><span class="badge" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); font-size: 1em; padding: 8px 16px;">${emp.employeeId}</span></td>
                <td><strong style="font-size: 1.05em;">${fullName}</strong></td>
                <td><small>${emp.email || 'N/A'}</small></td>
                <td><small>${emp.phoneNumber || 'N/A'}</small></td>
                <td><span class="badge bg-primary">${jobTitle}</span></td>
                <td><span class="badge bg-info">${deptName}</span></td>
                <td>${salary}</td>
                <td>${hireDate}</td>
                <td class="text-center">
                    <a href="/employee-details?employeeId=${emp.employeeId}" class="btn btn-primary btn-sm me-1">
                        <i class="bi bi-eye me-1"></i> Details
                    </a>
                    <a href="/job-history?employeeId=${emp.employeeId}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-clock-history me-1"></i> History
                    </a>
                </td>
            `;
            tbody.appendChild(row);
        });
    }
    
    function updatePagination() {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';
        
        if (totalPages <= 1) return;
        
        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 0 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#" onclick="loadEmployees(${currentPage - 1}); return false;"><i class="bi bi-chevron-left"></i> Previous</a>`;
        pagination.appendChild(prevLi);
        
        const startPage = Math.max(0, currentPage - 2);
        const endPage = Math.min(totalPages, startPage + 5);
        
        for (let i = startPage; i < endPage; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="loadEmployees(${i}); return false;">${i + 1}</a>`;
            pagination.appendChild(li);
        }
        
        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#" onclick="loadEmployees(${currentPage + 1}); return false;">Next <i class="bi bi-chevron-right"></i></a>`;
        pagination.appendChild(nextLi);
    }
    
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            currentSearch = e.target.value;
            loadEmployees(0); // Reset to page 1
        }, 300);
    });
    
    let emailSearchTimeout;
    document.getElementById('emailSearchInput').addEventListener('input', function(e) {
        clearTimeout(emailSearchTimeout);
        emailSearchTimeout = setTimeout(() => {
            currentEmailSearch = e.target.value;
            loadEmployees(0); // Reset to page 1
        }, 300);
    });
    
    document.getElementById('departmentFilter').addEventListener('change', function(e) {
        currentDept = e.target.value;
        loadEmployees(0); // Reset to page 1
    });
    
    document.getElementById('jobFilter').addEventListener('change', function(e) {
        currentJob = e.target.value;
        loadEmployees(0); // Reset to page 1
    });
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(() => { loadDepartments(); loadJobs(); loadEmployees(); }, 100));
    } else {
        setTimeout(() => { loadDepartments(); loadJobs(); loadEmployees(); }, 100);
    }
</script>
</th:block>
</body>
</html>
