<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Departments</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h5 class="mb-0">
                <i class="bi bi-diagram-3-fill me-2" style="color: #4facfe;"></i>
                All Departments - Managed by Nakul
            </h5>
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <a href="/department-add" class="btn btn-success btn-sm">
                    <i class="bi bi-plus-circle-fill me-1"></i> Add Department
                </a>
                <select id="locationFilter" class="form-select form-select-sm" style="width: 200px;">
                    <option value="">All Locations</option>
                </select>
                <div class="input-group" style="max-width: 300px;">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search departments...">
                </div>
            </div>
        </div>
        <div class="card-body">
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted fw-bold">Loading departments...</p>
            </div>
            
            <div id="departmentsTable" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th><i class="bi bi-hash me-1"></i>Department ID</th>
                                <th><i class="bi bi-diagram-3-fill me-1"></i>Department Name</th>
                                <th><i class="bi bi-person-badge me-1"></i>Manager</th>
                                <th><i class="bi bi-geo-alt me-1"></i>Location</th>
                                <th class="text-center"><i class="bi bi-gear-fill me-1"></i>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="departmentsBody"></tbody>
                    </table>
                </div>
                
                <nav aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>
            
            <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
    let currentPage = 0, pageSize = 10, totalPages = 0, locations = [];
    let currentSearch = '', currentLocation = '';
    
    async function loadLocations() {
        try {
            const data = await API.get('/locations?size=100');
            locations = data._embedded?.locationses || data._embedded?.locations || [];
            const select = document.getElementById('locationFilter');
            locations.forEach(location => {
                const option = document.createElement('option');
                option.value = location.locationId;
                option.textContent = `${location.city || 'Unknown'} (${location.locationId})`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading locations:', error);
        }
    }
    
    async function loadDepartments(page = 0) {
        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('departmentsTable').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            // Build query parameters
            let url = `/departments/search?page=${page}&size=${pageSize}`;
            if (currentSearch) url += `&query=${encodeURIComponent(currentSearch)}`;
            if (currentLocation) url += `&locationId=${currentLocation}`;
            
            const data = await API.get(url);
            const departments = data._embedded?.departmentses || data._embedded?.departments || [];
            totalPages = data.page?.totalPages || 1;
            currentPage = page;
            
            displayDepartments(departments);
            updatePagination();
            
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('departmentsTable').style.display = 'block';
        } catch (error) {
            console.error('Error loading departments:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load departments: ' + error.message;
        }
    }
    
    function displayDepartments(departments) {
        const tbody = document.getElementById('departmentsBody');
        tbody.innerHTML = '';
        
        if (departments.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5"><i class="bi bi-inbox" style="font-size: 3em; color: #ccc;"></i><p class="text-muted mt-3">No departments found</p></td></tr>';
            return;
        }
        
        departments.forEach((dept, index) => {
            // Handle manager name
            let managerName = 'N/A';
            if (dept.managerFirstName || dept.managerLastName) {
                const firstName = dept.managerFirstName || '';
                const lastName = dept.managerLastName || '';
                managerName = `${firstName} ${lastName}`.trim();
            }
            
            // Handle location - support both flat and nested formats
            let locationInfo = 'N/A';
            if (dept.location && dept.location.city) {
                // Nested format from search endpoint
                const city = dept.location.city || 'Unknown';
                const locationId = dept.location.locationId || dept.locationId;
                locationInfo = `${city} (${locationId})`;
            } else if (dept.locationCity) {
                // Flat format (legacy)
                const city = dept.locationCity || 'Unknown';
                const locationId = dept.locationId;
                locationInfo = `${city} (${locationId})`;
            } else if (dept.locationId) {
                // Only ID available
                locationInfo = `Location ${dept.locationId}`;
            }
            
            const row = document.createElement('tr');
            row.style.animationDelay = `${index * 0.05}s`;
            row.classList.add('animate__animated', 'animate__fadeInUp');
            row.innerHTML = `
                <td><span class="badge" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); font-size: 1em; padding: 8px 16px;">${dept.departmentId}</span></td>
                <td><strong style="font-size: 1.05em;">${dept.departmentName}</strong></td>
                <td>${managerName}</td>
                <td><span class="badge bg-info">${locationInfo}</span></td>
                <td class="text-center">
                    <div class="btn-group" role="group">
                        <a href="/department-details?departmentId=${dept.departmentId}" class="btn btn-primary btn-sm">
                            <i class="bi bi-eye me-1"></i> Details
                        </a>
                        <a href="/change-department-manager?departmentId=${dept.departmentId}&departmentName=${encodeURIComponent(dept.departmentName)}" class="btn btn-warning btn-sm">
                            <i class="bi bi-person-badge me-1"></i> Change Manager
                        </a>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });
    }
    
    function updatePagination() {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';
        
        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 0 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#" onclick="loadDepartments(${currentPage - 1}); return false;"><i class="bi bi-chevron-left"></i> Previous</a>`;
        pagination.appendChild(prevLi);
        
        const startPage = Math.max(0, currentPage - 2);
        const endPage = Math.min(totalPages, startPage + 5);
        
        for (let i = startPage; i < endPage; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="loadDepartments(${i}); return false;">${i + 1}</a>`;
            pagination.appendChild(li);
        }
        
        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#" onclick="loadDepartments(${currentPage + 1}); return false;">Next <i class="bi bi-chevron-right"></i></a>`;
        pagination.appendChild(nextLi);
    }
    
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            currentSearch = e.target.value;
            loadDepartments(0); // Reset to page 1
        }, 300);
    });
    
    document.getElementById('locationFilter').addEventListener('change', function(e) {
        currentLocation = e.target.value;
        loadDepartments(0); // Reset to page 1
    });
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(() => { loadLocations(); loadDepartments(); }, 100));
    } else {
        setTimeout(() => { loadLocations(); loadDepartments(); }, 100);
    }
</script>
</th:block>
</body>
</html>
