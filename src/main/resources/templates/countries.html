<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Countries</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h5 class="mb-0">
                <i class="bi bi-flag-fill me-2" style="color: #667eea;"></i>
                All Countries
            </h5>
            <div class="d-flex gap-2">
                <select id="regionFilter" class="form-select form-select-sm" style="width: 200px;">
                    <option value="">All Regions</option>
                </select>
                <div class="input-group" style="max-width: 300px;">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search countries...">
                </div>
            </div>
        </div>
        <div class="card-body">
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted fw-bold">Loading countries...</p>
            </div>
            
            <div id="countriesTable" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th><i class="bi bi-hash me-1"></i>Country ID</th>
                                <th><i class="bi bi-flag-fill me-1"></i>Country Name</th>
                                <th><i class="bi bi-globe2 me-1"></i>Region</th>
                                <th class="text-center"><i class="bi bi-gear-fill me-1"></i>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="countriesBody">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
                
                <nav aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination">
                        <!-- Pagination will be loaded here -->
                    </ul>
                </nav>
            </div>
            
            <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>
</div>

<!-- Page-specific scripts -->
<th:block layout:fragment="scripts">
<script>
    console.log('Countries.html script loaded');
    
    let currentPage = 0;
    let pageSize = 20;
    let totalPages = 0;
    let allCountries = [];
    let regions = [];
    
    async function loadRegions() {
        try {
            const data = await API.get('/regions?size=100');
            regions = data._embedded?.regions || [];
            
            const select = document.getElementById('regionFilter');
            regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region.regionId;
                option.textContent = region.regionName;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading regions:', error);
        }
    }
    
    async function loadCountries(page = 0) {
        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('countriesTable').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            const data = await API.get(`/countries?page=${page}&size=${pageSize}`);
            console.log('Countries data:', data);
            
            // Spring Data REST returns 'countrieses' instead of 'countries'
            allCountries = data._embedded?.countrieses || data._embedded?.countries || [];
            totalPages = data.page?.totalPages || 1;
            currentPage = page;
            
            console.log('Parsed countries:', allCountries);
            
            displayCountries(allCountries);
            updatePagination();
            
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('countriesTable').style.display = 'block';
        } catch (error) {
            console.error('Error loading countries:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load countries: ' + error.message;
        }
    }
    
    function displayCountries(countries) {
        const tbody = document.getElementById('countriesBody');
        tbody.innerHTML = '';
        
        if (countries.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 3em; color: #ccc;"></i>
                        <p class="text-muted mt-3">No countries found</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        countries.forEach((country, index) => {
            // Use flat projection fields first, fallback to nested
            const regionName = country.regionName || country.region?.regionName || 'N/A';
            const row = document.createElement('tr');
            row.style.animationDelay = `${index * 0.05}s`;
            row.classList.add('animate__animated', 'animate__fadeInUp');
            row.innerHTML = `
                <td>
                    <span class="badge" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-size: 1em; padding: 8px 16px;">
                        ${country.countryId}
                    </span>
                </td>
                <td><strong style="font-size: 1.05em;">${country.countryName}</strong></td>
                <td><span class="badge bg-info" style="font-size: 0.9em; padding: 6px 12px;">${regionName}</span></td>
                <td class="text-center">
                    <a href="/locations?countryId=${country.countryId}" class="btn btn-primary btn-sm">
                        <i class="bi bi-geo-alt-fill me-1"></i> View Locations
                    </a>
                </td>
            `;
            tbody.appendChild(row);
        });
    }
    
    function updatePagination() {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';
        
        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 0 ? 'disabled' : ''}`;
        prevLi.innerHTML = `
            <a class="page-link" href="#" onclick="loadCountries(${currentPage - 1}); return false;">
                <i class="bi bi-chevron-left"></i> Previous
            </a>
        `;
        pagination.appendChild(prevLi);
        
        const startPage = Math.max(0, currentPage - 2);
        const endPage = Math.min(totalPages, startPage + 5);
        
        for (let i = startPage; i < endPage; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="loadCountries(${i}); return false;">${i + 1}</a>`;
            pagination.appendChild(li);
        }
        
        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}`;
        nextLi.innerHTML = `
            <a class="page-link" href="#" onclick="loadCountries(${currentPage + 1}); return false;">
                Next <i class="bi bi-chevron-right"></i>
            </a>
        `;
        pagination.appendChild(nextLi);
    }
    
    // Search functionality with debounce
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allCountries.filter(country => 
                country.countryName.toLowerCase().includes(searchTerm) ||
                country.countryId.toLowerCase().includes(searchTerm)
            );
            displayCountries(filtered);
        }, 300);
    });
    
    // Region filter
    document.getElementById('regionFilter').addEventListener('change', function(e) {
        const regionId = e.target.value;
        if (regionId) {
            const filtered = allCountries.filter(country => {
                const countryRegionId = country.regionId || country.region?.regionId;
                return countryRegionId == regionId;
            });
            displayCountries(filtered);
        } else {
            displayCountries(allCountries);
        }
    });
    
    // Load data on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                loadRegions();
                loadCountries();
            }, 100);
        });
    } else {
        setTimeout(() => {
            loadRegions();
            loadCountries();
        }, 100);
    }
</script>
</th:block>

</body>
</html>
