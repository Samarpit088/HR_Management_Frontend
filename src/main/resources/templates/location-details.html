<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Location Details</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-3">
        <div class="col">
            <a href="/locations" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left me-2"></i>Back to Locations
            </a>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); color: white;">
            <h5 class="mb-0">
                <i class="bi bi-geo-alt-fill me-2"></i>
                Location Details - ID #<span id="locIdDisplay">...</span>
            </h5>
        </div>
        <div class="card-body">
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted fw-bold">Loading location details...</p>
            </div>
            
            <div id="detailsContent" style="display: none;">
                <!-- Location Info Card -->
                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="card" style="border-left: 5px solid #fcb69f;">
                            <div class="card-body">
                                <h5 class="card-title mb-3">
                                    <i class="bi bi-info-circle-fill me-2" style="color: #fcb69f;"></i>
                                    Location Information
                                </h5>
                                <div class="row">
                                    <div class="col-md-3">
                                        <p><strong>Location ID:</strong> <span id="locId" class="text-primary">-</span></p>
                                    </div>
                                    <div class="col-md-3">
                                        <p><strong>Street Address:</strong> <span id="streetAddr">-</span></p>
                                    </div>
                                    <div class="col-md-3">
                                        <p><strong>Postal Code:</strong> <span id="postalCode">-</span></p>
                                    </div>
                                    <div class="col-md-3">
                                        <p><strong>City:</strong> <span id="city">-</span></p>
                                    </div>
                                </div>
                                <div class="row mt-2">
                                    <div class="col-md-3">
                                        <p><strong>State/Province:</strong> <span id="stateProvince">-</span></p>
                                    </div>
                                    <div class="col-md-3">
                                        <p><strong>Country ID:</strong> <span id="countryId">-</span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Departments at this Location -->
                <h5 class="mb-3">
                    <i class="bi bi-diagram-3-fill me-2" style="color: #fcb69f;"></i>
                    Departments at this Location
                </h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); color: white;">
                            <tr>
                                <th>Department ID</th>
                                <th>Department Name</th>
                                <th>Manager ID</th>
                            </tr>
                        </thead>
                        <tbody id="departmentsBody">
                            <!-- Departments will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>
</div>

<!-- Page-specific scripts -->
<th:block layout:fragment="scripts">
<script>
    console.log('Location Details script loaded');
    
    const urlParams = new URLSearchParams(window.location.search);
    const locationId = urlParams.get('locationId');
    
    async function loadLocationDetails() {
        if (!locationId) {
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'No location ID provided';
            return;
        }
        
        document.getElementById('locIdDisplay').textContent = locationId;
        
        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('detailsContent').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            // Fetch location details
            const locData = await API.get(`/locations/${locationId}`);
            document.getElementById('locId').textContent = locData.locationId || '-';
            document.getElementById('streetAddr').textContent = locData.streetAddress || '-';
            document.getElementById('postalCode').textContent = locData.postalCode || '-';
            document.getElementById('city').textContent = locData.city || '-';
            document.getElementById('stateProvince').textContent = locData.stateProvince || '-';
            document.getElementById('countryId').textContent = locData.countryId || '-';
            
            // Fetch departments at this location
            const deptData = await API.get(`/departments/search/findByLocationLocationId?locationId=${locationId}&size=100`);
            const departments = deptData._embedded?.departmentses || deptData._embedded?.departments || [];
            
            displayDepartments(departments);
            
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('detailsContent').style.display = 'block';
            document.getElementById('detailsContent').classList.add('animate__animated', 'animate__fadeIn');
        } catch (error) {
            console.error('Error loading details:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load location details: ' + error.message;
        }
    }
    
    function displayDepartments(departments) {
        const tbody = document.getElementById('departmentsBody');
        tbody.innerHTML = '';
        
        if (departments.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 3em; color: #ccc;"></i>
                        <p class="text-muted mt-3">No departments found at this location</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        departments.forEach((dept, index) => {
            const row = document.createElement('tr');
            row.className = 'animate__animated animate__fadeInUp';
            row.style.animationDelay = `${index * 0.05}s`;
            
            row.innerHTML = `
                <td><span class="badge bg-primary">${dept.departmentId}</span></td>
                <td><strong>${dept.departmentName || '-'}</strong></td>
                <td>${dept.managerId || 'N/A'}</td>
            `;
            tbody.appendChild(row);
        });
    }
    
    // Load details on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadLocationDetails, 100);
        });
    } else {
        setTimeout(loadLocationDetails, 100);
    }
</script>
</th:block>

</body>
</html>
