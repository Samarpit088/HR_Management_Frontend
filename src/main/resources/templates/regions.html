<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Regions</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h5 class="mb-0">
                <i class="bi bi-globe2 me-2" style="color: #667eea;"></i>
                All Regions
            </h5>
            <div class="input-group" style="max-width: 350px;">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search regions...">
            </div>
        </div>
        <div class="card-body">
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted fw-bold">Loading regions...</p>
            </div>
            
            <div id="regionsTable" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th style="width: 20%;">
                                    <i class="bi bi-hash me-1"></i>Region ID
                                </th>
                                <th style="width: 50%;">
                                    <i class="bi bi-globe2 me-1"></i>Region Name
                                </th>
                                <th style="width: 30%;" class="text-center">
                                    <i class="bi bi-gear-fill me-1"></i>Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody id="regionsBody">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
                
                <nav aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination">
                        <!-- Pagination will be loaded here -->
                    </ul>
                </nav>
            </div>
            
            <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>
</div>

<!-- Page-specific scripts -->
<th:block layout:fragment="scripts">
<script>
    console.log('Regions.html script loaded');
    
    let currentPage = 0;
    let pageSize = 20;
    let totalPages = 0;
    let allRegions = [];
    
    async function loadRegions(page = 0) {
        console.log('loadRegions() called for page:', page);
        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('regionsTable').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            console.log('Fetching regions...');
            const data = await API.get(`/regions?page=${page}&size=${pageSize}`);
            console.log('Regions data received:', data);
            
            allRegions = data._embedded?.regions || [];
            totalPages = data.page?.totalPages || 1;
            currentPage = page;
            
            displayRegions(allRegions);
            updatePagination();
            
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('regionsTable').style.display = 'block';
            document.getElementById('regionsTable').classList.add('animate__animated', 'animate__fadeIn');
        } catch (error) {
            console.error('Error loading regions:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load regions: ' + error.message;
        }
    }
    
    function displayRegions(regions) {
        const tbody = document.getElementById('regionsBody');
        tbody.innerHTML = '';
        
        if (regions.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 3em; color: #ccc;"></i>
                        <p class="text-muted mt-3">No regions found</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        regions.forEach((region, index) => {
            const row = document.createElement('tr');
            row.style.animationDelay = `${index * 0.05}s`;
            row.classList.add('animate__animated', 'animate__fadeInUp');
            row.innerHTML = `
                <td>
                    <span class="badge" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-size: 1em; padding: 8px 16px;">
                        ${region.regionId}
                    </span>
                </td>
                <td>
                    <a href="/region-employees?regionId=${region.regionId}&regionName=${encodeURIComponent(region.regionName)}" 
                       class="text-decoration-none" style="color: #667eea; font-weight: 600; font-size: 1.05em;">
                        ${region.regionName}
                        <i class="bi bi-arrow-right-circle ms-2"></i>
                    </a>
                </td>
                <td class="text-center">
                    <a href="/countries?regionId=${region.regionId}" class="btn btn-outline-secondary btn-sm me-2">
                        <i class="bi bi-flag-fill me-1"></i> View Countries
                    </a>
                    <a href="/region-employees?regionId=${region.regionId}&regionName=${encodeURIComponent(region.regionName)}" 
                       class="btn btn-primary btn-sm">
                        <i class="bi bi-people-fill me-1"></i> View Employees
                    </a>
                </td>
            `;
            tbody.appendChild(row);
        });
    }
    
    function updatePagination() {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';
        
        // Previous button
        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 0 ? 'disabled' : ''}`;
        prevLi.innerHTML = `
            <a class="page-link" href="#" onclick="loadRegions(${currentPage - 1}); return false;">
                <i class="bi bi-chevron-left"></i> Previous
            </a>
        `;
        pagination.appendChild(prevLi);
        
        // Page numbers (show max 5 pages)
        const startPage = Math.max(0, currentPage - 2);
        const endPage = Math.min(totalPages, startPage + 5);
        
        for (let i = startPage; i < endPage; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="loadRegions(${i}); return false;">${i + 1}</a>`;
            pagination.appendChild(li);
        }
        
        // Next button
        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}`;
        nextLi.innerHTML = `
            <a class="page-link" href="#" onclick="loadRegions(${currentPage + 1}); return false;">
                Next <i class="bi bi-chevron-right"></i>
            </a>
        `;
        pagination.appendChild(nextLi);
    }
    
    // Search functionality with debounce
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allRegions.filter(region => 
                region.regionName.toLowerCase().includes(searchTerm) ||
                region.regionId.toString().includes(searchTerm)
            );
            displayRegions(filtered);
        }, 300);
    });
    
    // Load regions on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, calling loadRegions');
            setTimeout(loadRegions, 100);
        });
    } else {
        console.log('DOM already loaded, calling loadRegions');
        setTimeout(loadRegions, 100);
    }
</script>
</th:block>

</body>
</html>
