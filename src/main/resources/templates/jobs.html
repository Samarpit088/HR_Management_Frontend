<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
  <title>Jobs</title>
</head>
<body>
<div layout:fragment="content">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
      <h5 class="mb-0">
        <i class="bi bi-briefcase-fill me-2" style="color: #fa709a;"></i>
        All Job Positions - Managed by Samarpit
      </h5>
      <div class="input-group" style="max-width: 350px;">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search"></i>
                </span>
        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search jobs...">
      </div>
    </div>
    <div class="card-body">
      <div id="loadingSpinner" class="text-center py-5">
        <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted fw-bold">Loading jobs...</p>
      </div>

      <div id="jobsTable" style="display: none;">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
            <tr>
              <th><i class="bi bi-hash me-1"></i>Job ID</th>
              <th><i class="bi bi-briefcase-fill me-1"></i>Job Title</th>
              <th><i class="bi bi-currency-dollar me-1"></i>Min Salary</th>
              <th><i class="bi bi-currency-dollar me-1"></i>Max Salary</th>
              <th><i class="bi bi-bar-chart me-1"></i>Salary Range</th>
              <th class="text-center"><i class="bi bi-gear-fill me-1"></i>Actions</th>
            </tr>
            </thead>
            <tbody id="jobsBody"></tbody>
          </table>
        </div>

        <nav aria-label="Page navigation" class="mt-4">
          <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
      </div>

      <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="errorText"></span>
      </div>
    </div>
  </div>
</div>

<th:block layout:fragment="scripts">
  <script>
    let currentPage = 0, pageSize = 20, totalPages = 0, allJobs = [];

    async function loadJobs(page = 0) {
        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('jobsTable').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';

            const data = await API.get(`/jobs?page=${page}&size=${pageSize}`);
            allJobs = data._embedded?.jobses || data._embedded?.jobs || [];
            totalPages = data.page?.totalPages || 1;
            currentPage = page;

            displayJobs(allJobs);
            updatePagination();

            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('jobsTable').style.display = 'block';
        } catch (error) {
            console.error('Error loading jobs:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load jobs: ' + error.message;
        }
    }

    function formatCurrency(amount) {
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 0
        }).format(amount);
    }

    function displayJobs(jobs) {
        const tbody = document.getElementById('jobsBody');
        tbody.innerHTML = '';

        if (jobs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5"><i class="bi bi-inbox" style="font-size: 3em; color: #ccc;"></i><p class="text-muted mt-3">No jobs found</p></td></tr>';
            return;
        }

        jobs.forEach((job, index) => {
            const minSalary = job.minSalary || 0;
            const maxSalary = job.maxSalary || 0;
            const salaryRange = maxSalary - minSalary;

            const row = document.createElement('tr');
            row.style.animationDelay = `${index * 0.05}s`;
            row.classList.add('animate__animated', 'animate__fadeInUp');
            row.innerHTML = `
                <td><span class="badge" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); font-size: 1em; padding: 8px 16px;">${job.jobId}</span></td>
                <td><strong style="font-size: 1.05em;">${job.jobTitle}</strong></td>
                <td>${formatCurrency(minSalary)}</td>
                <td>${formatCurrency(maxSalary)}</td>
                <td>
                    <div class="progress" style="height: 25px;">
                        <div class="progress-bar bg-success" role="progressbar" style="width: 100%" aria-valuenow="${salaryRange}" aria-valuemin="0" aria-valuemax="${maxSalary}">
                            ${formatCurrency(salaryRange)}
                        </div>
                    </div>
                </td>
                <td class="text-center">
                    <a href="/job-details?jobId=${encodeURIComponent(job.jobId)}" class="btn btn-primary btn-sm me-1">
                        <i class="bi bi-eye me-1"></i> Details
                    </a>
                    <a href="/employees?jobId=${job.jobId}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-people-fill me-1"></i> Employees
                    </a>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function updatePagination() {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 0 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#" onclick="loadJobs(${currentPage - 1}); return false;"><i class="bi bi-chevron-left"></i> Previous</a>`;
        pagination.appendChild(prevLi);

        const startPage = Math.max(0, currentPage - 2);
        const endPage = Math.min(totalPages, startPage + 5);

        for (let i = startPage; i < endPage; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="loadJobs(${i}); return false;">${i + 1}</a>`;
            pagination.appendChild(li);
        }

        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#" onclick="loadJobs(${currentPage + 1}); return false;">Next <i class="bi bi-chevron-right"></i></a>`;
        pagination.appendChild(nextLi);
    }

    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allJobs.filter(job =>
                job.jobTitle.toLowerCase().includes(searchTerm) ||
                job.jobId.toLowerCase().includes(searchTerm)
            );
            displayJobs(filtered);
        }, 300);
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(loadJobs, 100));
    } else {
        setTimeout(loadJobs, 100);
    }
  </script>
</th:block>
</body>
</html>
