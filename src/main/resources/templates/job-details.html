<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
  <title>Job Details</title>
</head>
<body>
<div layout:fragment="content">
  <!-- Header with Smart Back Button -->
  <div class="row mb-4">
    <div class="col">
      <button id="backButton" class="btn btn-outline-primary" onclick="goBack()">
        <i class="bi bi-arrow-left me-2"></i><span id="backButtonText">Back to Jobs</span>
      </button>
    </div>
  </div>

  <!-- Main Card -->
  <div class="card shadow-sm">
    <div class="card-header" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white;">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
          <i class="bi bi-briefcase-fill me-2"></i>
          Job Details - <span id="jobIdDisplay">...</span>
        </h5>
      </div>
    </div>
    <div class="card-body">
      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="text-center py-5">
        <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted fw-bold">Loading job details...</p>
      </div>

      <!-- Details Content -->
      <div id="detailsContent" style="display: none;">
        <!-- Job Information Card -->
        <div class="card mb-4" style="border-left: 5px solid #fa709a;">
          <div class="card-body">
            <h5 class="card-title mb-4">
              <i class="bi bi-info-circle-fill me-2" style="color: #fa709a;"></i>
              Job Information
            </h5>
            <div class="row g-4">
              <div class="col-md-3">
                <label class="text-muted small mb-1">Job ID</label>
                <p class="fw-bold mb-0 fs-5"><span id="jobId" class="text-primary">-</span></p>
              </div>
              <div class="col-md-5">
                <label class="text-muted small mb-1">Job Title</label>
                <p class="fw-bold mb-0 fs-5" id="jobTitle">-</p>
              </div>
              <div class="col-md-2">
                <label class="text-muted small mb-1">Min Salary</label>
                <p class="mb-0 text-success fw-bold" id="minSalary">-</p>
              </div>
              <div class="col-md-2">
                <label class="text-muted small mb-1">Max Salary</label>
                <p class="mb-0 text-success fw-bold" id="maxSalary">-</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Employees Section -->
        <div class="card" style="border-left: 5px solid #fee140;">
          <div class="card-body">
            <h5 class="card-title mb-4">
              <i class="bi bi-people-fill me-2" style="color: #fa709a;"></i>
              Employees in this Role
              <span class="badge bg-warning text-dark ms-2" id="employeeCount">0</span>
            </h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                  <th class="text-center" style="width: 100px;">ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th class="text-center">Hire Date</th>
                  <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody id="employeesBody">
                <!-- Employees will be loaded here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="alert alert-danger animate__animated animate__shakeX" style="display: none;">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="errorText"></span>
      </div>
    </div>
  </div>
</div>

<!-- Page-specific scripts -->
<th:block layout:fragment="scripts">
  <script>
    console.log('Job Details script loaded');

    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('jobId');
    const returnUrl = urlParams.get('returnUrl');

    // Smart back button function
    function goBack() {
        // Priority 1: Use returnUrl parameter if provided
        if (returnUrl) {
            window.location.href = decodeURIComponent(returnUrl);
            return;
        }

        // Priority 2: Check document.referrer and navigate directly
        const referrer = document.referrer;
        if (referrer && referrer.includes(window.location.host)) {
            if (referrer.includes('/departments')) {
                window.location.href = '/departments';
                return;
            } else if (referrer.includes('/employees')) {
                window.location.href = '/employees';
                return;
            } else if (referrer.includes('/jobs')) {
                window.location.href = '/jobs';
                return;
            }
        }

        // Priority 3: Default to jobs list
        window.location.href = '/jobs';
    }

    // Update back button text based on referrer
    function updateBackButtonText() {
        const referrer = document.referrer;
        const backButtonText = document.getElementById('backButtonText');

        if (returnUrl) {
            backButtonText.textContent = 'Back';
        } else if (referrer && referrer.includes(window.location.host)) {
            if (referrer.includes('/departments')) {
                backButtonText.textContent = 'Back to Departments';
            } else if (referrer.includes('/employees')) {
                backButtonText.textContent = 'Back to Employees';
            } else {
                backButtonText.textContent = 'Back';
            }
        } else {
            backButtonText.textContent = 'Back to Jobs';
        }
    }

    async function loadJobDetails() {
        if (!jobId) {
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'No job ID provided';
            return;
        }

        document.getElementById('jobIdDisplay').textContent = jobId;
        updateBackButtonText();

        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('detailsContent').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';

            // Fetch job details
            const jobData = await API.get(`/jobs/${jobId}`);

            // Job Information
            document.getElementById('jobId').textContent = jobData.jobId || '-';
            document.getElementById('jobTitle').textContent = jobData.jobTitle || '-';
            document.getElementById('minSalary').textContent = jobData.minSalary
                ? new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(jobData.minSalary)
                : '-';
            document.getElementById('maxSalary').textContent = jobData.maxSalary
                ? new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(jobData.maxSalary)
                : '-';

            // Fetch employees with this job
            const employeesData = await API.get(`/employees/search/findByJobJobId?jobId=${encodeURIComponent(jobId)}&size=100`);
            const employees = employeesData._embedded?.employeeses || employeesData._embedded?.employees || [];

            document.getElementById('employeeCount').textContent = employees.length;
            displayEmployees(employees);

            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('detailsContent').style.display = 'block';
            document.getElementById('detailsContent').classList.add('animate__animated', 'animate__fadeIn');
        } catch (error) {
            console.error('Error loading details:', error);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Failed to load job details: ' + error.message;
        }
    }

    function displayEmployees(employees) {
        const tbody = document.getElementById('employeesBody');
        tbody.innerHTML = '';

        if (employees.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 3em; color: #ccc;"></i>
                        <p class="text-muted mt-3 mb-0">No employees found with this job role</p>
                    </td>
                </tr>
            `;
            return;
        }

        employees.forEach((emp, index) => {
            const row = document.createElement('tr');
            row.className = 'animate__animated animate__fadeInUp';
            row.style.animationDelay = `${index * 0.03}s`;

            const fullName = `${emp.firstName || ''} ${emp.lastName || ''}`.trim();
            const departmentName = emp.department?.departmentName || emp.departmentName || '-';
            const hireDate = emp.hireDate ? new Date(emp.hireDate).toLocaleDateString() : '-';

            row.innerHTML = `
                <td class="text-center">
                    <span class="badge bg-primary rounded-pill">${emp.employeeId}</span>
                </td>
                <td>
                    <div class="d-flex align-items-center">
                        <div class="avatar-circle me-2" style="width: 35px; height: 35px; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
                            ${fullName.charAt(0).toUpperCase()}
                        </div>
                        <strong>${fullName}</strong>
                    </div>
                </td>
                <td><small>${emp.email || '-'}</small></td>
                <td><span class="badge bg-info text-dark">${departmentName}</span></td>
                <td class="text-center">${hireDate}</td>
                <td class="text-center">
                    <a href="/employee-details?employeeId=${emp.employeeId}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-eye me-1"></i>View
                    </a>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // Load details on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadJobDetails, 100);
        });
    } else {
        setTimeout(loadJobDetails, 100);
    }
  </script>
</th:block>

</body>
</html>
